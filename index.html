<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Classroom Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --p: #1a6df0;
            --bg: #dbeafe;
            --c: rgba(255, 255, 255, .75);
            --t: #12263f;
            --m: #64748b;
            --l: rgba(100, 130, 180, .18);
            --in: #fff;
            --fs-base: 14px;
            --fs-h2: 22px;
            --spacing-main: 22px;
        }
        [data-t=d] {
            --bg: #0b1630;
            --c: rgba(25, 40, 75, .85);
            --t: #e6eefc;
            --m: #9fb2d4;
            --l: rgba(255, 255, 255, .12);
            --in: #16264a;
        }
        * {
            box-sizing: border-box;
            margin: 0;
        }
        body {
            font-family: Prompt, Sarabun, sans-serif;
            color: var(--t);
            font-size: var(--fs-base);
            min-height: 100vh;
            background: radial-gradient(at 0 0, #a9d4ff, transparent 50%), radial-gradient(at 100% 100%, #b9c8ff, transparent 50%), var(--bg);
            background-attachment: fixed;
        }
        .lay {
            display: flex;
            min-height: 100vh;
        }
        .side {
            width: 240px;
            background: linear-gradient(180deg, #0b3a8f, #1558d6);
            color: #fff;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: auto;
            flex-shrink: 0;
        }
        .pf {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, .12);
            border-radius: 14px;
        }
        .pf small {
            display: block;
            opacity: .75;
            font-size: 0.85em;
        }
        .av {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            color: #1558d6;
            display: grid;
            place-items: center;
            font-weight: 600;
            font-size: 18px;
            flex-shrink: 0;
        }
        .nv {
            background: none;
            border: 0;
            color: #fff;
            text-align: left;
            padding: 11px 14px;
            border-radius: 12px;
            font: inherit;
            cursor: pointer;
            opacity: .85;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }
        .nv:hover {
            background: rgba(255, 255, 255, .15);
        }
        .nv.on {
            background: linear-gradient(135deg, #38d6ff, #1a6df0);
            color: #fff;
            font-weight: 500;
            opacity: 1;
            box-shadow: 0 0 16px rgba(56, 214, 255, .45);
        }
        main {
            flex: 1;
            padding: var(--spacing-main);
            min-width: 0;
        }
        .hd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 10px;
            flex-wrap: wrap;
        }
        h2 { font-size: var(--fs-h2); }
        h3 { margin-bottom: 10px; font-size: 1.15rem; }
        .card {
            background: var(--c);
            backdrop-filter: blur(14px);
            border: 1px solid var(--l);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 8px 28px rgba(30, 80, 170, .1);
        }
        .tw { overflow-x: auto; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 14px;
            margin-bottom: 14px;
        }
        .gr2 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px;
        }
        .gr2 .card { margin: 0; }
        .sc {
            background: var(--c);
            border: 1px solid var(--l);
            border-radius: 18px;
            padding: 16px;
            position: relative;
            overflow: hidden;
            border-left: 4px solid #38d6ff;
        }
        .sc b {
            font-size: 2rem;
            display: block;
            color: var(--p);
        }
        .sc span { color: var(--m); font-size: 0.9rem; }
        .b {
            background: linear-gradient(135deg, #1a6df0, #0d8bff);
            color: #fff;
            border: 0;
            padding: 10px 18px;
            border-radius: 999px;
            font: inherit;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(26, 109, 240, .3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.95rem;
        }
        .b:hover { filter: brightness(1.08); }
        .b.g {
            background: var(--in);
            color: var(--p);
            border: 1px solid var(--l);
            box-shadow: none;
        }
        .b.d {
            background: #fee2e2;
            color: #dc2626;
            box-shadow: none;
        }
        .b.s { padding: 6px 12px; font-size: 0.85rem; }
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--l);
            border-radius: 12px;
            font: inherit;
            background: var(--in);
            color: var(--t);
        }
        input[type=checkbox], input[type=radio] { width: auto; }
        .fl {
            display: block;
            margin-bottom: 12px;
            color: var(--m);
            font-size: 0.9rem;
        }
        .fl input, .fl select, .fl textarea { margin-top: 6px; color: var(--t); }
        .r2, .r3, .r4 {
            display: grid;
            gap: 12px;
            grid-template-columns: 1fr 1fr;
        }
        .r3 { grid-template-columns: 2fr 1fr; }
        .r4 { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 11px 10px;
            text-align: left;
            border-bottom: 1px solid var(--l);
        }
        th { color: var(--m); font-weight: 500; font-size: 0.9rem; }
        td { font-size: 0.95rem; }
        .ac { white-space: nowrap; text-align: right; }
        .ac .b { margin-left: 4px; }
        .ar {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 14px;
            align-items: center;
            flex-wrap: wrap;
        }
        .li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--l);
        }
        .li select { width: auto; flex: 1; }
        .mu { color: var(--m); margin: 4px 0; font-size: 0.9rem; }
        .emp { text-align: center; color: var(--m); padding: 32px; font-size: 0.95rem; }
        code {
            background: var(--in);
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 0.9em;
        }
        .tg {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: #e2e8f0;
            color: #334155;
            display: inline-block;
        }
        .tg.ม { background: #dcfce7; color: #15803d; }
        .tg.ส { background: #fef3c7; color: #b45309; }
        .tg.ข { background: #fee2e2; color: #dc2626; }
        .tg.ล { background: #dbeafe; color: #1d4ed8; }
        .bar {
            height: 8px;
            background: var(--l);
            border-radius: 9px;
            margin: 10px 0 6px;
            overflow: hidden;
        }
        .bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #1a6df0, #00b4ff);
        }
        .ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin: auto;
        }
        .ring b {
            background: var(--bg);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 1.3rem;
        }
        .gpa { text-align: right; font-size: 1.05rem; margin-top: 12px; }
        .two {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
        }
        .two .card { margin: 0; }
        .mo {
            position: fixed;
            inset: 0;
            background: rgba(10, 25, 60, .45);
            display: grid;
            place-items: center;
            z-index: 9;
            padding: 12px;
        }
        .md {
            background: var(--bg);
            color: var(--t);
            border-radius: 22px;
            padding: 22px;
            width: min(500px, 100%);
            max-height: 90vh;
            overflow: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translate(-50%, 80px);
            background: #12263f;
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            transition: .3s;
            z-index: 20;
            font-size: 0.95rem;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
        #toast.show { transform: translate(-50%, 0); }
        .au {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            align-items: center;
        }
        .hero {
            padding: 60px;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(135deg, #0a3a95, #1a6df0 60%, #38bdf8);
        }
        .hero h1 { font-size: 2.7rem; margin: 14px 0; }
        .hero p { font-size: 1.05rem; opacity: .9; line-height: 1.7; }
        .lg { font-size: 4rem; }
        
        .form {
            max-width: 420px;
            width: calc(100% - 32px);
            margin: 20px auto;
            padding: 28px;
        }
        .form h2 { text-align: center; }
        .form .b { width: 100%; margin-top: 8px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .tabs .b { margin: 0; }
        
        #pr { display: none; }
 
        /* ---- MEDIA QUERIES สำหรับปรับขนาดอุปกรณ์ (Responsive Adaptive Scaling) ---- */
        @media(max-width: 1024px) {
            :root {
                --fs-base: 13.5px;
                --fs-h2: 20px;
                --spacing-main: 16px;
            }
            .side { width: 210px; }
        }
 
        @media(max-width: 768px) {
            :root {
                --fs-base: 13px;
                --fs-h2: 18px;
                --spacing-main: 12px;
            }
            .au { grid-template-columns: 1fr; }
            .hero { min-height: auto; padding: 28px 20px; text-align: center; align-items: center; }
            .hero h1 { font-size: 2rem; }
            .hero p { font-size: 0.95rem; }
            .lg { font-size: 3rem; }
            .lay { flex-direction: column; }
            .side {
                width: 100%;
                height: auto;
                flex-direction: row;
                position: sticky;
                top: 0;
                z-index: 10;
                overflow-x: auto;
                padding: 10px;
                gap: 6px;
                border-bottom: 1px solid rgba(255,255,255,0.15);
            }
            .pf { display: none; }
            .nv { 
                white-space: nowrap; 
                padding: 8px 12px; 
                font-size: 0.9rem;
                border-radius: 10px;
            }
            .two { grid-template-columns: 1fr; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .sc b { font-size: 1.6rem; }
            .card { padding: 14px; border-radius: 16px; }
            .ar { justify-content: stretch; }
            .ar .b { flex: 1; justify-content: center; }
        }
 
        @media(max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
        }
 
        @media print {
            body.pp > *:not(#pr) { display: none !important; }
            body.pp #pr { display: block; color: #000; padding: 20px; }
            #pr table { border: 1px solid #000; }
            #pr th, #pr td { border: 1px solid #000; color: #000; }
            .tr { page-break-after: always; }
            .tr:last-child { page-break-after: auto; }
        }
 
        /* ---- Modern Futuristic UI Polish ---- */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image: linear-gradient(rgba(26, 109, 240, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(26, 109, 240, .06) 1px, transparent 1px);
            background-size: 44px 44px;
        }
        .side {
            background: linear-gradient(200deg, #050f33, #0b3a9c 60%, #1b6df0);
            box-shadow: 4px 0 30px rgba(10, 40, 120, .25);
        }
        main { animation: fi .3s ease-out; }
        @keyframes fi {
            from { opacity: 0; transform: translateY(6px); }
        }
        h2 {
            background: linear-gradient(90deg, #0b3a9c, #1a9bff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        [data-t=d] h2 {
            background: linear-gradient(90deg, #7fe8ff, #9db8ff);
            -webkit-background-clip: text;
            background-clip: text;
        }
        .card { transition: .25s; }
        .gr2 .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(30, 100, 220, .2);
        }
        .sc::after {
            content: "";
            position: absolute;
            right: -20px;
            top: -20px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(rgba(56, 214, 255, .35), transparent 70%);
        }
        tr:hover td { background: rgba(56, 214, 255, .06); }
        input:focus, select:focus, textarea:focus {
            outline: 2px solid #38d6ff;
            border-color: transparent;
        }
        .au {
            position: relative;
            overflow: hidden;
            background: #050f33;
        }
        .scene {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .au::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(90deg, rgba(4, 12, 45, .78), transparent 65%);
        }
        .hero { position: relative; z-index: 2; background: none; }
        .hero h1 { text-shadow: 0 0 30px rgba(56, 214, 255, .5); }
        .form {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(18px);
            --t: #12263f;
            --m: #64748b;
            --in: #fff;
            --l: rgba(100, 130, 180, .25);
            color: #12263f;
            border-radius: 24px;
            box-shadow: 0 0 45px rgba(56, 214, 255, .3);
        }
        .orbs { animation: fl 6s ease-in-out infinite alternate; }
        @keyframes fl {
            to { transform: translateY(-22px); }
        }
        .tr {
            background: #fff;
            color: #000;
            padding: 26px;
            border: 2px solid #1a3d8f;
            margin-bottom: 16px;
            font-family: Prompt, Sarabun, sans-serif;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .trh {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            border-bottom: 3px double #1a3d8f;
            padding-bottom: 12px;
            line-height: 1.7;
        }
        .trl { flex: 1; font-size: 13px; }
        .trc { flex: 1.2; text-align: center; }
        .trc h1 { font-size: 22px; color: #1a3d8f; }
        .trp {
            width: 105px;
            height: 135px;
            border: 1.5px solid #1a3d8f;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: #888;
            font-size: 12px;
            text-align: center;
        }
        .trp img { width: 100%; height: 100%; object-fit: cover; }
        .tr table { width: 100%; border-collapse: collapse; margin: 8px 0; }
        .tr th, .tr td {
            border: 1px solid #333;
            padding: 5px;
            text-align: center;
            color: #000;
            font-size: 12.5px;
        }
        .tr th { background: #e6eefc; }
        .tr td.l { text-align: left; }
        .tr h4 { margin-top: 12px; color: #1a3d8f; }
        .sg {
            display: flex;
            justify-content: space-around;
            margin-top: 40px;
            text-align: center;
            font-size: 13px;
        }
 
        .pill { display: inline-flex; gap: 6px; flex-wrap: wrap; }
        .pill button { border: 1px solid var(--l); background: var(--in); color: var(--t); padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
        .pill button.on { color: #fff; border-color: transparent; }
        .pill button.on.ม { background: #16a34a; } .pill button.on.ส { background: #f59e0b; } .pill button.on.ข { background: #ef4444; } .pill button.on.ล { background: #3b82f6; } .pill button.on.n { background: var(--p); }
        .tg.r { background: #fef3c7; color: #b45309; } .tg.z { background: #fee2e2; color: #b91c1c; }
        table.sc2 th, table.sc2 td { white-space: nowrap; text-align: center; font-size: 13px; }
        .sticky1 { position: sticky; left: 0; background: var(--bg); z-index: 2; }
        .cell { display: inline-block; min-width: 46px; padding: 3px 8px; border-radius: 8px; cursor: pointer; }
        .cell:hover { outline: 2px solid #38d6ff; }
        .c-ok { background: #dcfce7; color: #166534; } .c-wait { background: #dbeafe; color: #1d4ed8; } .c-miss { background: #fee2e2; color: #b91c1c; font-weight: 600; } .c-todo { background: #f1f5f9; color: #64748b; } .c-run { background: #fef3c7; color: #b45309; }
        .wheelbox { display: grid; grid-template-columns: minmax(300px, 1.1fr) 1fr; gap: 16px; align-items: start; }
        #wc { width: min(420px, 100%); height: auto; aspect-ratio: 1; display: block; margin: auto; }
        @media (max-width: 800px) { .wheelbox { grid-template-columns: 1fr; } }
    </style>
</head>

    <div id="pr"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
 
    <script>
        const CFG = { URL: 'https://kgvsrpuvkeunznwtgfma.supabase.co/rest/v1/', KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtndnNycHV2a2V1bnpud3RnZm1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNTkwMjEsImV4cCI6MjEwNzgzNTAyMX0.GVtQ9X2u9AX1JuMB6jsQfwQ9qlp9MvlRUrCdeKEOvKU' };

        }
        const sb = supabase.createClient(CFG.URL, CFG.KEY);
        const sb2 = supabase.createClient(CFG.URL, CFG.KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
        const ADMIN_EMAIL = '123@classroom.app';
        const em = u => { u = u.trim().toLowerCase(); return (/^[a-z0-9]+$/.test(u) ? u : 'x' + [...new TextEncoder().encode(u)].map(b => b.toString(16).padStart(2, '0')).join('')) + '@classroom.app'; };
        const px = p => 'cm_' + p;
 
        const $ = s => document.querySelector(s);
        const g = id => document.getElementById(id).value;
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        
        let D = { users: [], classes: [], att: {}, tasks: [], notes: [], codes: [], attOpen: {} };
        let me = null, V = 'home', sel = {}, rr = 'student';
 
        let AU = null, SN = {};
        const emptyD = () => ({ users: [], classes: [], att: {}, tasks: [], notes: [], codes: [], attOpen: {} });
        const reme = () => { me = !AU ? null : AU.email === ADMIN_EMAIL ? gu('admin') : (D.users.find(u => u.id == AU.id) || null); };
        const omit = (o, ks) => Object.fromEntries(Object.entries(o).filter(([k]) => !ks.includes(k)));
        const sj = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.entries(x).sort(([a], [b]) => a < b ? -1 : 1)) : x);
 
        const TS = [
            { t: 'profiles', pk: ['id'],
              rows: () => D.users.map(u => ({ id: u.id, username: u.u, full_name: u.name, role: u.role, photo: u.ph || null, extra: omit(u, ['id', 'u', 'name', 'role', 'ph', 'p']) })),
              from: (r, d) => d.users = r.map(x => ({ id: x.id, u: x.username, name: x.full_name, role: x.role, ...(x.photo ? { ph: x.photo } : {}), ...x.extra })) },

        function parseTextExam() {
            const raw = $('#import_text').value.trim();
            if (!raw) return toast('วางข้อความข้อสอบก่อน');
            const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
            let currentQ = null, questions = [];
 
            lines.forEach(line => {
                if (/^\d+[\.\)]/.test(line) || !currentQ) {
                    if (currentQ && currentQ.c.length >= 2) questions.push(currentQ);
                    currentQ = { q: line.replace(/^\d+[\.\)]\s*/, ''), c: [], a: 0, p: 1 };
                } else if (/^[ก-งa-dA-D][\.\)]/.test(line)) {
                    let text = line.replace(/^[ก-งa-dA-D][\.\)]\s*/, '');
                    if (text.endsWith('*')) {
                        text = text.slice(0, -1);
                        currentQ.a = currentQ.c.length;
                    }
                    currentQ.c.push(text);
                }
            });
            if (currentQ && currentQ.c.length >= 2) questions.push(currentQ);
 
            if (!questions.length) return toast('รูปแบบข้อความไม่ถูกต้อง');
            questions.forEach(q => $('#qs').insertAdjacentHTML('beforeend', qb(q)));
            toast(`นำเข้าข้อสอบสำเร็จ ${questions.length} ข้อ`);
            $('#import_text').value = '';
        }
 
        function parseFileExam(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data)) {
                        data.forEach(q => $('#qs').insertAdjacentHTML('beforeend', qb(q)));
                        toast(`นำเข้าข้อสอบจากไฟล์สำเร็จ ${data.length} ข้อ`);
                    }
                } catch (err) {
                    $('#import_text').value = e.target.result;
                    parseTextExam();
                }
            };
            reader.readAsText(file);
        }
