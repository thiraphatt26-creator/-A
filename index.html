<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Classroom Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --p: #1a6df0;
            --bg: #dbeafe;
            --c: rgba(255, 255, 255, .75);
            --t: #12263f;
            --m: #64748b;
            --l: rgba(100, 130, 180, .18);
            --in: #fff;
            --fs-base: 14px;
            --fs-h2: 22px;
            --spacing-main: 22px;
        }
        [data-t=d] {
            --bg: #0b1630;
            --c: rgba(25, 40, 75, .85);
            --t: #e6eefc;
            --m: #9fb2d4;
            --l: rgba(255, 255, 255, .12);
            --in: #16264a;
        }
        * {
            box-sizing: border-box;
            margin: 0;
        }
        body {
            font-family: Prompt, Sarabun, sans-serif;
            color: var(--t);
            font-size: var(--fs-base);
            min-height: 100vh;
            background: radial-gradient(at 0 0, #a9d4ff, transparent 50%), radial-gradient(at 100% 100%, #b9c8ff, transparent 50%), var(--bg);
            background-attachment: fixed;
        }
        .lay {
            display: flex;
            min-height: 100vh;
        }
        .side {
            width: 240px;
            background: linear-gradient(180deg, #0b3a8f, #1558d6);
            color: #fff;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: auto;
            flex-shrink: 0;
        }
        .pf {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, .12);
            border-radius: 14px;
        }
        .pf small {
            display: block;
            opacity: .75;
            font-size: 0.85em;
        }
        .av {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            color: #1558d6;
            display: grid;
            place-items: center;
            font-weight: 600;
            font-size: 18px;
            flex-shrink: 0;
        }
        .nv {
            background: none;
            border: 0;
            color: #fff;
            text-align: left;
            padding: 11px 14px;
            border-radius: 12px;
            font: inherit;
            cursor: pointer;
            opacity: .85;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }
        .nv:hover {
            background: rgba(255, 255, 255, .15);
        }
        .nv.on {
            background: linear-gradient(135deg, #38d6ff, #1a6df0);
            color: #fff;
            font-weight: 500;
            opacity: 1;
            box-shadow: 0 0 16px rgba(56, 214, 255, .45);
        }
        main {
            flex: 1;
            padding: var(--spacing-main);
            min-width: 0;
        }
        .hd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 10px;
            flex-wrap: wrap;
        }
        h2 { font-size: var(--fs-h2); }
        h3 { margin-bottom: 10px; font-size: 1.15rem; }
        .card {
            background: var(--c);
            backdrop-filter: blur(14px);
            border: 1px solid var(--l);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 8px 28px rgba(30, 80, 170, .1);
        }
        .tw { overflow-x: auto; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 14px;
            margin-bottom: 14px;
        }
        .gr2 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px;
        }
        .gr2 .card { margin: 0; }
        .sc {
            background: var(--c);
            border: 1px solid var(--l);
            border-radius: 18px;
            padding: 16px;
            position: relative;
            overflow: hidden;
            border-left: 4px solid #38d6ff;
        }
        .sc b {
            font-size: 2rem;
            display: block;
            color: var(--p);
        }
        .sc span { color: var(--m); font-size: 0.9rem; }
        .b {
            background: linear-gradient(135deg, #1a6df0, #0d8bff);
            color: #fff;
            border: 0;
            padding: 10px 18px;
            border-radius: 999px;
            font: inherit;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(26, 109, 240, .3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.95rem;
        }
        .b:hover { filter: brightness(1.08); }
        .b.g {
            background: var(--in);
            color: var(--p);
            border: 1px solid var(--l);
            box-shadow: none;
        }
        .b.d {
            background: #fee2e2;
            color: #dc2626;
            box-shadow: none;
        }
        .b.s { padding: 6px 12px; font-size: 0.85rem; }
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--l);
            border-radius: 12px;
            font: inherit;
            background: var(--in);
            color: var(--t);
        }
        input[type=checkbox], input[type=radio] { width: auto; }
        .fl {
            display: block;
            margin-bottom: 12px;
            color: var(--m);
            font-size: 0.9rem;
        }
        .fl input, .fl select, .fl textarea { margin-top: 6px; color: var(--t); }
        .r2, .r3, .r4 {
            display: grid;
            gap: 12px;
            grid-template-columns: 1fr 1fr;
        }
        .r3 { grid-template-columns: 2fr 1fr; }
        .r4 { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 11px 10px;
            text-align: left;
            border-bottom: 1px solid var(--l);
        }
        th { color: var(--m); font-weight: 500; font-size: 0.9rem; }
        td { font-size: 0.95rem; }
        .ac { white-space: nowrap; text-align: right; }
        .ac .b { margin-left: 4px; }
        .ar {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 14px;
            align-items: center;
            flex-wrap: wrap;
        }
        .li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--l);
        }
        .li select { width: auto; flex: 1; }
        .mu { color: var(--m); margin: 4px 0; font-size: 0.9rem; }
        .emp { text-align: center; color: var(--m); padding: 32px; font-size: 0.95rem; }
        code {
            background: var(--in);
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 0.9em;
        }
        .tg {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: #e2e8f0;
            color: #334155;
            display: inline-block;
        }
        .tg.ม { background: #dcfce7; color: #15803d; }
        .tg.ส { background: #fef3c7; color: #b45309; }
        .tg.ข { background: #fee2e2; color: #dc2626; }
        .tg.ล { background: #dbeafe; color: #1d4ed8; }
        .bar {
            height: 8px;
            background: var(--l);
            border-radius: 9px;
            margin: 10px 0 6px;
            overflow: hidden;
        }
        .bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #1a6df0, #00b4ff);
        }
        .ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin: auto;
        }
        .ring b {
            background: var(--bg);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 1.3rem;
        }
        .gpa { text-align: right; font-size: 1.05rem; margin-top: 12px; }
        .two {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
        }
        .two .card { margin: 0; }
        .mo {
            position: fixed;
            inset: 0;
            background: rgba(10, 25, 60, .45);
            display: grid;
            place-items: center;
            z-index: 9;
            padding: 12px;
        }
        .md {
            background: var(--bg);
            color: var(--t);
            border-radius: 22px;
            padding: 22px;
            width: min(500px, 100%);
            max-height: 90vh;
            overflow: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translate(-50%, 80px);
            background: #12263f;
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            transition: .3s;
            z-index: 20;
            font-size: 0.95rem;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
        #toast.show { transform: translate(-50%, 0); }
        .au {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            align-items: center;
        }
        .hero {
            padding: 60px;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(135deg, #0a3a95, #1a6df0 60%, #38bdf8);
        }
        .hero h1 { font-size: 2.7rem; margin: 14px 0; }
        .hero p { font-size: 1.05rem; opacity: .9; line-height: 1.7; }
        .lg { font-size: 4rem; }
        
        .form {
            max-width: 420px;
            width: calc(100% - 32px);
            margin: 20px auto;
            padding: 28px;
        }
        .form h2 { text-align: center; }
        .form .b { width: 100%; margin-top: 8px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .tabs .b { margin: 0; }
        
        #pr { display: none; }
 
        /* ---- MEDIA QUERIES สำหรับปรับขนาดอุปกรณ์ (Responsive Adaptive Scaling) ---- */
        @media(max-width: 1024px) {
            :root {
                --fs-base: 13.5px;
                --fs-h2: 20px;
                --spacing-main: 16px;
            }
            .side { width: 210px; }
        }
 
        @media(max-width: 768px) {
            :root {
                --fs-base: 13px;
                --fs-h2: 18px;
                --spacing-main: 12px;
            }
            .au { grid-template-columns: 1fr; }
            .hero { min-height: auto; padding: 28px 20px; text-align: center; align-items: center; }
            .hero h1 { font-size: 2rem; }
            .hero p { font-size: 0.95rem; }
            .lg { font-size: 3rem; }
            .lay { flex-direction: column; }
            .side {
                width: 100%;
                height: auto;
                flex-direction: row;
                position: sticky;
                top: 0;
                z-index: 10;
                overflow-x: auto;
                padding: 10px;
                gap: 6px;
                border-bottom: 1px solid rgba(255,255,255,0.15);
            }
            .pf { display: none; }
            .nv { 
                white-space: nowrap; 
                padding: 8px 12px; 
                font-size: 0.9rem;
                border-radius: 10px;
            }
            .two { grid-template-columns: 1fr; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .sc b { font-size: 1.6rem; }
            .card { padding: 14px; border-radius: 16px; }
            .ar { justify-content: stretch; }
            .ar .b { flex: 1; justify-content: center; }
        }
 
        @media(max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
        }
 
        @media print {
            body.pp > *:not(#pr) { display: none !important; }
            body.pp #pr { display: block; color: #000; padding: 20px; }
            #pr table { border: 1px solid #000; }
            #pr th, #pr td { border: 1px solid #000; color: #000; }
            .tr { page-break-after: always; }
            .tr:last-child { page-break-after: auto; }
        }
 
        /* ---- Modern Futuristic UI Polish ---- */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image: linear-gradient(rgba(26, 109, 240, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(26, 109, 240, .06) 1px, transparent 1px);
            background-size: 44px 44px;
        }
        .side {
            background: linear-gradient(200deg, #050f33, #0b3a9c 60%, #1b6df0);
            box-shadow: 4px 0 30px rgba(10, 40, 120, .25);
        }
        main { animation: fi .3s ease-out; }
        @keyframes fi {
            from { opacity: 0; transform: translateY(6px); }
        }
        h2 {
            background: linear-gradient(90deg, #0b3a9c, #1a9bff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        [data-t=d] h2 {
            background: linear-gradient(90deg, #7fe8ff, #9db8ff);
            -webkit-background-clip: text;
            background-clip: text;
        }
        .card { transition: .25s; }
        .gr2 .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(30, 100, 220, .2);
        }
        .sc::after {
            content: "";
            position: absolute;
            right: -20px;
            top: -20px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(rgba(56, 214, 255, .35), transparent 70%);
        }
        tr:hover td { background: rgba(56, 214, 255, .06); }
        input:focus, select:focus, textarea:focus {
            outline: 2px solid #38d6ff;
            border-color: transparent;
        }
        .au {
            position: relative;
            overflow: hidden;
            background: #050f33;
        }
        .scene {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .au::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(90deg, rgba(4, 12, 45, .78), transparent 65%);
        }
        .hero { position: relative; z-index: 2; background: none; }
        .hero h1 { text-shadow: 0 0 30px rgba(56, 214, 255, .5); }
        .form {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(18px);
            --t: #12263f;
            --m: #64748b;
            --in: #fff;
            --l: rgba(100, 130, 180, .25);
            color: #12263f;
            border-radius: 24px;
            box-shadow: 0 0 45px rgba(56, 214, 255, .3);
        }
        .orbs { animation: fl 6s ease-in-out infinite alternate; }
        @keyframes fl {
            to { transform: translateY(-22px); }
        }
        .tr {
            background: #fff;
            color: #000;
            padding: 26px;
            border: 2px solid #1a3d8f;
            margin-bottom: 16px;
            font-family: Prompt, Sarabun, sans-serif;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .trh {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            border-bottom: 3px double #1a3d8f;
            padding-bottom: 12px;
            line-height: 1.7;
        }
        .trl { flex: 1; font-size: 13px; }
        .trc { flex: 1.2; text-align: center; }
        .trc h1 { font-size: 22px; color: #1a3d8f; }
        .trp {
            width: 105px;
            height: 135px;
            border: 1.5px solid #1a3d8f;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: #888;
            font-size: 12px;
            text-align: center;
        }
        .trp img { width: 100%; height: 100%; object-fit: cover; }
        .tr table { width: 100%; border-collapse: collapse; margin: 8px 0; }
        .tr th, .tr td {
            border: 1px solid #333;
            padding: 5px;
            text-align: center;
            color: #000;
            font-size: 12.5px;
        }
        .tr th { background: #e6eefc; }
        .tr td.l { text-align: left; }
        .tr h4 { margin-top: 12px; color: #1a3d8f; }
        .sg {
            display: flex;
            justify-content: space-around;
            margin-top: 40px;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="m"></div>
    <div id="m2"></div>
    <div id="toast"></div>
    <div id="pr"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
 
    <script>
        const CFG = { URL: 'https://kgvsrpuvkeunznwtgfma.supabase.co/rest/v1/', KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtndnNycHV2a2V1bnpud3RnZm1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNTkwMjEsImV4cCI6MjEwNzgzNTAyMX0.GVtQ9X2u9AX1JuMB6jsQfwQ9qlp9MvlRUrCdeKEOvKU' };
        CFG.URL = CFG.URL.trim().replace(/\/rest\/v1\/?$/, '').replace(/\/+$/, '');
        CFG.KEY = CFG.KEY.trim();
        if (!window.supabase || CFG.URL.includes('YOUR-PROJECT') || CFG.KEY.includes('YOUR-ANON')) {
            document.getElementById('app').innerHTML = '<div style="max-width:560px;margin:12vh auto;padding:24px;background:#fff;border-radius:16px;font-family:sans-serif"><h2>ตั้งค่า Supabase ก่อนใช้งาน</h2><p style="margin-top:10px">' + (!window.supabase ? 'โหลดไลบรารี Supabase ไม่ได้ ตรวจสอบอินเทอร์เน็ต' : 'เปิดไฟล์ index.html แล้วแก้ค่า URL และ KEY ที่บรรทัด <b>const CFG</b> ด้านบนของ script') + '</p></div>';
            throw new Error('Supabase is not configured');
        }
        const sb = supabase.createClient(CFG.URL, CFG.KEY);
        const sb2 = supabase.createClient(CFG.URL, CFG.KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
        const ADMIN_EMAIL = '123@classroom.app';
        const em = u => { u = u.trim().toLowerCase(); return (/^[a-z0-9]+$/.test(u) ? u : 'x' + [...new TextEncoder().encode(u)].map(b => b.toString(16).padStart(2, '0')).join('')) + '@classroom.app'; };
        const px = p => 'cm_' + p;
 
        const $ = s => document.querySelector(s);
        const g = id => document.getElementById(id).value;
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        
        let D = { users: [], classes: [], att: {}, tasks: [], notes: [], codes: [], attOpen: {} };
        let me = null, V = 'home', sel = {}, rr = 'student';
 
        let AU = null, SN = {};
        const emptyD = () => ({ users: [], classes: [], att: {}, tasks: [], notes: [], codes: [], attOpen: {} });
        const reme = () => { me = !AU ? null : AU.email === ADMIN_EMAIL ? gu('admin') : (D.users.find(u => u.id == AU.id) || null); };
        const omit = (o, ks) => Object.fromEntries(Object.entries(o).filter(([k]) => !ks.includes(k)));
        const sj = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.entries(x).sort(([a], [b]) => a < b ? -1 : 1)) : x);
 
        const TS = [
            { t: 'profiles', pk: ['id'],
              rows: () => D.users.map(u => ({ id: u.id, username: u.u, full_name: u.name, role: u.role, photo: u.ph || null, extra: omit(u, ['id', 'u', 'name', 'role', 'ph', 'p']) })),
              from: (r, d) => d.users = r.map(x => ({ id: x.id, u: x.username, name: x.full_name, role: x.role, ...(x.photo ? { ph: x.photo } : {}), ...x.extra })) },
            { t: 'classes', pk: ['id'],
              rows: () => D.classes.map(c => ({ id: c.id, name: c.name, subject: c.sub, owner_id: c.o, extra: omit(c, ['id', 'name', 'sub', 'o', 'm']) })),
              from: (r, d) => d.classes = r.map(x => ({ id: x.id, name: x.name, sub: x.subject, o: x.owner_id, m: [], ...x.extra })) },
            { t: 'class_members', pk: ['class_id', 'user_id'], par: ['class_id', 'classes'],
              rows: () => D.classes.flatMap(c => c.m.map(u => ({ class_id: c.id, user_id: u }))),
              from: (r, d) => { const m = new Map(d.classes.map(c => [c.id, c])); r.forEach(x => m.get(x.class_id)?.m.push(x.user_id)); } },
            { t: 'tasks', pk: ['id'], par: ['class_id', 'classes'],
              rows: () => D.tasks.map(t => ({ id: t.id, class_id: t.c, task_type: t.y, title: t.t, max_score: t.max ?? null, extra: omit(t, ['id', 'c', 'y', 't', 'max', 's']) })),
              from: (r, d) => d.tasks = r.map(x => ({ id: x.id, y: x.task_type, c: x.class_id, t: x.title, ...(x.max_score != null ? { max: +x.max_score } : {}), s: {}, ...x.extra })) },
            { t: 'submissions', pk: ['task_id', 'user_id'], par: ['task_id', 'tasks'],
              rows: () => D.tasks.flatMap(t => Object.entries(t.s || {}).map(([u, e]) => ({ task_id: t.id, user_id: u, score: e.g ?? null, data: e }))),
              from: (r, d) => { const m = new Map(d.tasks.map(t => [t.id, t])); r.forEach(x => { const t = m.get(x.task_id); if (t) t.s[x.user_id] = x.data; }); } },
            { t: 'files', pk: ['id'], par: ['task_id', 'tasks'],

        function parseTextExam() {
            const raw = $('#import_text').value.trim();
            if (!raw) return toast('วางข้อความข้อสอบก่อน');
            const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
            let currentQ = null, questions = [];

            lines.forEach(line => {
                if (/^\d+[\.\)]/.test(line) || !currentQ) {
                    if (currentQ && currentQ.c.length >= 2) questions.push(currentQ);
                    currentQ = { q: line.replace(/^\d+[\.\)]\s*/, ''), c: [], a: 0, p: 1 };
                } else if (/^[ก-งa-dA-D][\.\)]/.test(line)) {
                    let text = line.replace(/^[ก-งa-dA-D][\.\)]\s*/, '');
                    if (text.endsWith('*')) {
                        text = text.slice(0, -1);
                        currentQ.a = currentQ.c.length;
                    }
                    currentQ.c.push(text);
                }
            });
            if (currentQ && currentQ.c.length >= 2) questions.push(currentQ);

            if (!questions.length) return toast('รูปแบบข้อความไม่ถูกต้อง');
            questions.forEach(q => $('#qs').insertAdjacentHTML('beforeend', qb(q)));
            toast(`นำเข้าข้อสอบสำเร็จ ${questions.length} ข้อ`);

        }

                    if (Array.isArray(data)) {

                    }
                } catch (err) {
                    $('#import_text').value = e.target.result;
                    parseTextExam();
                }
            };
            reader.readAsText(file);
        }

            cs.forEach((c, i) => {
                const r = calc(c.id, u), k = rk(c).find(y => y.u == u).k;
                if (r.gp != null) gp.push(r.gp);
                a += `<tr><td>${i + 1}</td><td class=l>${esc(c.sub)}<br><small>${esc(c.name)}</small></td><td class=l>${esc((gu(c.o) || {}).name || '-')}</td><td>${r.a}</td><td>${r.m}</td><td>${r.p == null ? '-' : r.p.toFixed(1)}</td><td><b>${r.l}</b></td><td>${k}/${c.m.length}</td></tr>`;
                d += `<h4>${i + 1}. ${esc(c.sub)} (${esc(c.name)}) — คะแนนที่ได้ ${r.a}/${r.m} เกรด ${r.l} ลำดับที่ ${k}/${c.m.length}</h4><table><tr><th>รายการ</th><th>ประเภท</th><th>คะแนนที่ได้</th><th>คะแนนเต็ม</th></tr>${D.tasks.filter(t => t.c == c.id).map(t => { const s = t.s[u], ok = s && s.g != null && !s.run; return `<tr><td class=l>${esc(t.t)}</td><td>${TY[t.y]}</td><td>${ok ? s.g : '-'}</td><td>${t.max}</td></tr>`; }).join('') || '<tr><td colspan=4>ยังไม่มีรายการ</td></tr>'}</table>`;
            });
            return `<div class=tr><div class=trh><div class=trl><b style="font-size:17px">${esc(x.name)}</b><br>ชั้นเรียน: ${esc([...new Set(cs.map(c => c.name))].join(', ') || '-')}<br>ชื่อผู้ใช้: ${esc(x.u || '-')}<br>วันที่ออกเอกสาร: ${fd(today())}</div><div class=trc><h1>ใบรายงานผลการเรียน</h1><p>Student Grade Report</p></div><div class=trp>${x.ph ? `<img src="${x.ph}">` : 'ติดรูปถ่าย'}</div></div><h3 style="text-align:center;margin:12px 0 0">สรุปผลการเรียนรายวิชา</h3><table><tr><th>ที่</th><th>รายวิชา</th><th>ครูผู้สอน</th><th>คะแนนที่ได้</th><th>คะแนนเต็ม</th><th>ร้อยละ</th><th>เกรด</th><th>ลำดับในห้อง</th></tr>${a || '<tr><td colspan=8>ยังไม่มีรายวิชา</td></tr>'}</table><p style="text-align:right"><b>เกรดเฉลี่ย (GPA): ${gp.length ? (gp.reduce((p, q) => p + q) / gp.length).toFixed(2) : '-'}</b></p><h3 style="margin-top:10px">รายละเอียดคะแนนแต่ละรายวิชา</h3>${d}<div class=sg><div>.................................<br>ครูผู้สอน</div><div>.................................<br>ผู้ดูแลระบบ</div></div></div>`;
        }
 
        const pp = () => { document.body.classList.add('pp'); window.onafterprint = () => document.body.classList.remove('pp'); window.print(); };
        
        function prev(h) {
            $('#pr').innerHTML = h;
            $('#m').innerHTML = `<div class=mo onclick="if(event.target==this)cm()"><div class=md style="width:min(900px,100%)"><div class=ar style="margin:0 0 10px"><button class="b g" onclick=cm()>ปิด</button><button class=b onclick=pp()>🖨️ พิมพ์ / บันทึกเป็น PDF</button></div>${h}</div></div>`;
        }
 
        function xp() {
            const cs = MC();
            if (!cs.length) return head('ส่งออกใบเกรด') + emp('ยังไม่มีห้องเรียน');
            const s = cSel(cs, 'xc'), c = cs.find(x => x.id == sel.xc);
            return head('ส่งออกใบเกรด') + `<div class=card style="max-width:580px">${s}<p class=mu>ประเภทเอกสาร</p><label><input type=radio name=xm value=t checked> ใบรายงานผลการเรียนรายบุคคล (มีรูปนักเรียน)</label><br><label><input type=radio name=xm value=r> ตารางลำดับคะแนนของห้อง (1 → สุดท้าย)</label><label class=fl style="margin-top:10px">นักเรียน (สำหรับใบรายบุคคล)<select id=xs><option value="">ทั้งห้อง</option>${c.m.map(u => `<option value=${u}>${esc(nm(u))}</option>`).join('')}</select></label><p class=mu>รูปแบบไฟล์ (สำหรับตารางลำดับ)</p><label><input type=radio name=fm value=pdf checked> PDF</label> &nbsp; <label><input type=radio name=fm value=csv> Excel (CSV)</label><button class=b style="width:100%;margin-top:14px" onclick=xdo()>ส่งออก</button></div>`;
        }
 
        function xdo() {
            const c = D.classes.find(x => x.id == sel.xc), m = document.querySelector('[name=xm]:checked').value, f = document.querySelector('[name=fm]:checked').value;
            if (m == 't') {
                const u = g('xs'), l = u ? [u] : c.m;
                if (!l.length) return toast('ห้องนี้ยังไม่มีนักเรียน');
                prev(l.map(x => tr(x)).join(''));
            } else ex(brow(c, { s: 1, a: 1, g: 1 }), 'ลำดับคะแนน ' + c.name + ' ' + c.sub, f);
        }
 
        function rrows() {
            return [['ห้องเรียน', 'วิชา', 'นักเรียน', 'งาน/กิจกรรม', 'เข้าเรียน (%)', 'คะแนนเฉลี่ย (%)'], ...MC().map(c => {
                let a = 0, t = 0;
                Object.entries(D.att).forEach(([k, v]) => { if (k.split('|')[0] == c.id) Object.values(v).forEach(x => { t++; if (x != 'ข' && x != 'ล') a++; }); });
                const ps = c.m.map(u => calc(c.id, u).p).filter(p => p != null);
                return [c.name, c.sub, c.m.length, D.tasks.filter(x => x.c == c.id).length, t ? (a / t * 100).toFixed(1) : '-', ps.length ? (ps.reduce((x, y) => x + y) / ps.length).toFixed(1) : '-'];
            })];
        }
 
        const report = () => head('รายงาน', `<button class="b g" onclick="csv(rrows(),'รายงานห้องเรียน')">Excel</button> <button class=b onclick="pr('รายงานภาพรวมห้องเรียน',rrows())">PDF</button>`) + `<div class=card>${rrows().length > 1 ? tbl(rrows()) : emp('ยังไม่มีข้อมูล')}</div>`;
 
        function nts() {
            const ids = MC().map(c => c.id), l = D.notes.filter(n => me.role == 'admin' || n.o == me.id || !n.c || ids.includes(n.c)).map(n => ({ ...n, t: n.t + (n.b ? ' — ' + n.b : ''), d: n.d }));
            if (!isT()) D.tasks.filter(t => ids.includes(t.c) && !t.s[me.id] && t.d).forEach(t => {
                const dd = (new Date(t.d + 'T00:00') - new Date(today() + 'T00:00')) / 864e5;
                if (dd <= 3) l.push({ id: t.id, t: `${dd < 0 ? 'เลยกำหนด' : 'ใกล้กำหนด'}: ${t.t} (${cn(t.c)}) ${fd(t.d)}`, d: t.d, a: 1 });
            });
            return l.sort((a, b) => (b.d || '').localeCompare(a.d || ''));
        }
 
        function notes() {
            const l = nts();
            return head('แจ้งเตือน', isT() ? '<button class=b onclick=nf()>+ ประกาศ</button>' : '') + `<div class=card>${l.map(n => `<div class=li><div>${n.a ? '⏰' : '📢'} ${esc(n.t)}<br><small class=mu>${fd(n.d)}</small></div>${isT() && !n.a ? `<button class="b s d" onclick="ndel('${n.id}')">ลบ</button>` : ''}</div>`).join('') || emp('ไม่มีแจ้งเตือน')}</div>`;
        }
 
        const nf = () => modal('สร้างประกาศ', fld('ห้องเรียน', 'f1', '', 'select', [['', 'ทุกห้อง'], ...MC().map(c => [c.id, c.name + ' ' + c.sub])]) + fld('หัวข้อ', 'f2') + fld('รายละเอียด', 'f3', '', 'area'), 'nsv()');
        
        function nsv() {
            const t = g('f2').trim();
            if (!t) return toast('กรอกหัวข้อ');
            D.notes.push({ id: uid(), t, b: g('f3'), c: g('f1'), o: me.id, d: today() });
            save();
            cm();
            R();
        }
 
        const ndel = id => { D.notes = D.notes.filter(n => n.id != id); save(); R(); };
 
        const codesCard = () => `<div class=card><div class=hd style="margin:0 0 8px"><h3 style="margin:0">รหัสสมัครครู</h3><button class="b s" onclick=ncode()>+ สร้างรหัสใหม่</button></div><p class=mu>ครูต้องกรอกรหัสนี้ตอนสมัคร (ใช้ได้ครั้งเดียว) เพื่อป้องกันผู้อื่นสมัครเป็นครู</p>${D.codes.map(c => `<div class=li><span><code>${c.c}</code>${c.u ? 'ใช้แล้วโดย ' + esc(c.u) : '<span class="tg ม">ยังไม่ถูกใช้</span>'}</span><button class="b s d" onclick="dcode('${c.c}')">ลบ</button></div>`).join('') || '<p class=mu>ยังไม่มีรหัส</p>'}</div>`;
        
        const ncode = () => { D.codes.push({ c: Math.random().toString(36).slice(2, 10).toUpperCase().padEnd(8, 'X'), u: '' }); save(); R(); },
              dcode = k => { D.codes = D.codes.filter(c => c.c != k); save(); R(); };
 
        function users() {
            return head('จัดการผู้ใช้', '<button class=b onclick=uf()>+ เพิ่มผู้ใช้</button>') + codesCard() + `<div class="card tw">${D.users.length ? `<table><tr><th>ชื่อ</th><th>ชื่อผู้ใช้</th><th>บทบาท</th><th></th></tr>${D.users.map(u => `<tr><td>${avs(u)} ${esc(u.name)}</td><td>${esc(u.u)}</td><td>${u.role == 'teacher' ? 'ครู' : 'นักเรียน'}</td><td class=ac><label class="b s g">📷<input type=file accept=image/* hidden onchange="setPh('${u.id}',this)"></label><button class="b s g" onclick="upw('${u.id}')">รีเซ็ตรหัส</button><button class="b s d" onclick="udel('${u.id}')">ลบ</button></td></tr>`).join('')}</table>` : emp('ยังไม่มีผู้ใช้')}</div>`;
        }
 
        const uf = () => modal('เพิ่มผู้ใช้', fld('บทบาท', 'f1', 'student', 'select', [['student', 'นักเรียน'], ['teacher', 'ครู']]) + fld('ชื่อ-นามสกุล', 'f2') + fld('ชื่อผู้ใช้', 'f3') + fld('รหัสผ่าน', 'f4'), 'usv()');
        
        async function usv() {
            const role = g('f1'), n = g('f2').trim(), u = g('f3').trim(), p = g('f4');
            if (!n || !u || !p) return toast('กรอกข้อมูลให้ครบ');
            if (p.length < 3) return toast('รหัสผ่านอย่างน้อย 3 ตัวอักษร');
            if (u == '123' || D.users.some(a => a.u == u)) return toast('ชื่อผู้ใช้ซ้ำ');
            const r = await sb2.auth.signUp({ email: em(u), password: px(p) });
            if (r.error || !r.data.user) return toast(/registered|already/i.test((r.error || {}).message || '') ? 'ชื่อผู้ใช้ซ้ำ' : (r.error || {}).message || 'สร้างผู้ใช้ไม่สำเร็จ');
            D.users.push({ id: r.data.user.id, u, name: n, role });
            await save();
            cm();
            R();
        }
 
        const upw = async id => {
                  const p = prompt('ตั้งรหัสผ่านใหม่ (อย่างน้อย 3 ตัว)');
                  if (!p || p.length < 3) return;
                  const { error } = await sb.rpc('admin_set_password', { target: id, pw: px(p) });
                  toast(error ? error.message : 'เปลี่ยนรหัสผ่านแล้ว');
              },
              udel = async id => {
                  if (!confirm('ลบผู้ใช้นี้?')) return;
                  const { error } = await sb.rpc('admin_delete_user', { target: id });
                  if (error) return toast(error.message);
                  D.users = D.users.filter(u => u.id != id);
                  D.classes.forEach(c => c.m = c.m.filter(x => x != id));
                  await save();
                  R();
              };
 
        function set() {
            return head('ตั้งค่า') + `<div class=card style="max-width:560px">${me.role != 'admin' ? `<div class=ar style="justify-content:flex-start"><div class=av style="width:70px;height:70px;font-size:28px;border:2px solid var(--p);${me.ph ? `background:url(${me.ph}) center/cover` : ''}">${me.ph ? '' : '👤'}</div><label class="b g">📷 อัปโหลดรูปโปรไฟล์<input type=file accept=image/* hidden onchange="setPh('${me.id}',this)"></label></div>` + fld('ชื่อ-นามสกุล', 'f1', me.name) + `<button class=b onclick=sname()>บันทึกชื่อ</button><hr style="margin:16px 0;border:0;border-top:1px solid var(--l)">` : ''}<h3>เปลี่ยนรหัสผ่าน</h3>${fld('รหัสผ่านใหม่', 'f2', '', 'password')}<button class=b onclick=spw()>เปลี่ยนรหัสผ่าน</button><hr style="margin:16px 0;border:0;border-top:1px solid var(--l)"><label><input type=checkbox ${D.dark ? 'checked' : ''} onchange="D.dark=this.checked;save();R()"> โหมดมืด</label><hr style="margin:16px 0;border:0;border-top:1px solid var(--l)"><h3>สำรองข้อมูล</h3><div class=ar style="justify-content:flex-start"><button class="b g" onclick=bk()>ส่งออกข้อมูลสำรอง</button><label class="b g">นำเข้าข้อมูล<input type=file accept=.json hidden onchange=imp(this)></label>${me.role == 'admin' ? '<button class="b d" onclick=wipe()>ล้างข้อมูลทั้งหมด</button>' : ''}</div><hr style="margin:16px 0;border:0;border-top:1px solid var(--l)"><button class="b d" onclick=logout()>ออกจากระบบ</button></div>`;
        }
 
        const sname = () => { const n = g('f1').trim(); if (!n) return; me.name = n; save(); R(); toast('บันทึกแล้ว'); };
        
        const spw = async () => {
            const p = g('f2');
            if (p.length < 3) return toast('รหัสผ่านสั้นเกินไป');
            const { error } = await sb.auth.updateUser({ password: px(p) });
            toast(error ? error.message : 'เปลี่ยนรหัสผ่านแล้ว');
        };
 
        const bk = () => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(D)], { type: 'application/json' }));
            a.download = 'classroom-backup.json';
            a.click();
        };
 
        const imp = i => {
            const f = i.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = () => {
                try {
                    const x = JSON.parse(r.result);
                    if (!x.users || !x.classes) throw 0;
                    D = x;
                    save();
                    me = gu(me.id) || gu('admin');
                    R();
                    toast('นำเข้าข้อมูลสำเร็จ');
                } catch (e) { toast('ไฟล์ไม่ถูกต้อง'); }
            };
            r.readAsText(f);
        };
 
        const wipe = () => {
            if (confirm('ลบข้อมูลทั้งหมดถาวร?')) {
                D = { users: D.users, classes: [], att: {}, tasks: [], notes: [], codes: D.codes || [], attOpen: {} };
                save();
                R();
            }
        };
 
        window.onerror = m => { console.error(m); toast('เกิดข้อผิดพลาด: ' + m); };
 
       setInterval(async () => {
            if (!me || document.hidden || $('#m').innerHTML || $('#m2').innerHTML) return;
            const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
            if (await loadD()) { reme(); R(); }
        }, 20000);
        loadCloudData();
    </script>
</body>
</html>
